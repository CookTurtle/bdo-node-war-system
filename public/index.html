<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>據點戰戰績查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extra.css"></head><body>
<header><strong>據點戰戰績</strong><span class="sp"></span><a id="navUpload" href="/upload.html" hidden>上傳戰績</a><a id="navEdit" href="/edit.html" hidden>資料清理</a><a id="adminLink" href="/admin.html" hidden>成員名單</a><span id="who"></span><a id="logout" href="/api/auth/logout" hidden>登出</a></header>
<main id="gate" hidden>
<p>查詢戰績需要使用 Discord 登入，且帳號須擁有公會指定身份組（由機器人自動同步）。</p>
<p><a href="/api/auth/login">使用 Discord 登入</a></p>
</main>
<main id="app" hidden>
<span class="search"><input id="q" placeholder="輸入家門名稱（支援模糊搜尋）" size="28" autocomplete="off" autofocus><ul id="sug" hidden></ul></span>
<button id="go">查詢</button>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v>=1e5?Math.round(v/1e4)+'萬':v.toLocaleString();
const t=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const ST={succession:'繼承',awakening:'覺醒',open:'開放'};
let ME=null;

// ---------- 模糊搜尋：名字清單載入一次，在瀏覽器內比對 ----------
let NAMES=[];
let ready=Promise.resolve();
function startReady(){
  ready=(async()=>{
    try{const c=JSON.parse(sessionStorage.nw_names||'null');if(c&&Date.now()-c.t<3e5)return NAMES=c.n;}catch{}
    const r=await fetch('/api/players');
    if(!r.ok)throw new Error('無法載入名單');
    NAMES=await r.json();
    try{sessionStorage.nw_names=JSON.stringify({t:Date.now(),n:NAMES});}catch{}
  })();
  return ready;
}
(async()=>{
  ME=await(await fetch('/api/auth/me')).json();
  if(!ME){$('gate').hidden=false;return;}
  $('app').hidden=false;
  $('logout').hidden=false;
  $('who').textContent=ME.name||ME.id;
  if(ME.role==='admin'){
    $('adminLink').hidden=false;
    $('navUpload').hidden=false;
    $('navEdit').hidden=false;
  }
  startReady();
})();
function approx(q,s){            // q 在 s 的任一子字串中的最小編輯距離
  let prev=Array.from({length:q.length+1},(_,i)=>i),best=prev[q.length];
  for(let j=1;j<=s.length;j++){const cur=[0];
    for(let i=1;i<=q.length;i++)cur[i]=Math.min(prev[i]+1,cur[i-1]+1,prev[i-1]+(q[i-1]===s[j-1]?0:1));
    prev=cur;best=Math.min(best,prev[q.length]);}
  return best;
}
function fuzzy(q,limit=8){       // 排序：完全相同 > 開頭相同 > 包含 > 依序包含 > 容許錯字（長度越長容許越多）
  q=q.trim().toLowerCase();if(!q)return[];
  const k=q.length<=2?0:q.length<=4?1:2,out=[];
  for(const name of NAMES){
    const s=name.toLowerCase();let sc;
    if(s===q)sc=0;else if(s.startsWith(q))sc=1;else if(s.includes(q))sc=2;
    else{let i=0;for(const c of s)if(c===q[i])i++;
      if(q.length>=2&&i===q.length)sc=3;else{const d=approx(q,s);if(d<=k)sc=4+d;}}
    if(sc!==undefined)out.push([sc,Math.abs(s.length-q.length),name]);
  }
  return out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,limit).map(x=>x[2]);
}

// ---------- 建議清單（支援滑鼠與上下鍵）----------
let hi=-1;
function showSug(){
  const list=fuzzy($('q').value);hi=-1;
  $('sug').innerHTML=list.map(x=>`<li data-name="${esc(x)}">${esc(x)}</li>`).join('');
  $('sug').hidden=!list.length;
}
$('q').oninput=async()=>{await ready;showSug();};
$('q').onkeydown=e=>{
  const items=[...$('sug').children];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;
    hi=(hi+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((li,i)=>li.classList.toggle('on',i===hi));}
  else if(e.key==='Enter'){search(hi>=0&&items[hi]?items[hi].dataset.name:undefined);}
  else if(e.key==='Escape')$('sug').hidden=true;
};
$('sug').onmousedown=e=>{const li=e.target.closest('li');if(li){e.preventDefault();search(li.dataset.name);}};
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('sug').hidden=true;});
$('out').onclick=e=>{const b=e.target.closest('[data-name]');if(b)search(b.dataset.name);};

// ---------- 查詢 ----------
async function search(name){
  name=(name??$('q').value).trim();if(!name)return;
  $('q').value=name;$('sug').hidden=true;
  history.replaceState(null,'','?name='+encodeURIComponent(name));
  await ready;
  const rows=await(await fetch('/api/players/'+encodeURIComponent(name))).json();
  if(!rows.length){
    const alt=fuzzy(name,6);
    $('out').innerHTML=`<p class="hint">查無「${esc(name)}」的戰績。</p>`+
      (alt.length?`<p class="alts">你是不是要找：${alt.map(a=>`<button data-name="${esc(a)}">${esc(a)}</button>`).join('')}</p>`:'');
    return;
  }
  const avg=k=>rows.reduce((s,r)=>s+r[k],0)/rows.length,K=rows.reduce((s,r)=>s+r.kills,0),D=rows.reduce((s,r)=>s+r.deaths,0);
  const sum=[['場次',rows.length],['平均擊殺',avg('kills').toFixed(1)],['平均死亡',avg('deaths').toFixed(1)],
    ['K/D',(K/Math.max(D,1)).toFixed(2)],['平均傷害',n(Math.round(avg('dmg_dealt')))],['平均要塞傷害',n(Math.round(avg('fort_dmg')))]];
  $('out').innerHTML=`<div class="sum">${sum.map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>
  <div class="scroll"><table><tr><th>日期<th>職業<th>擊殺<th>死亡<th>連殺<th>造成傷害<th>受到傷害<th>控制<th>恢復<th>要塞傷害<th>生存 / 時長</tr>`+
  rows.map(r=>`<tr><td>${r.played_on}<td>${esc(r.class_id||'?')} ${ST[r.style]||''}<td>${r.kills}<td>${r.deaths}<td>${r.max_streak}<td>${n(r.dmg_dealt)}<td>${n(r.dmg_taken)}<td>${r.cc_hits}<td>${n(r.heal)}<td>${n(r.fort_dmg)}<td>${t(r.alive_sec)} / ${t(r.duration_sec)}`).join('')+'</table></div>';
}
$('go').onclick=()=>search();
const p=new URLSearchParams(location.search).get('name');if(p){$('q').value=p;search();}
</script></body></html>
